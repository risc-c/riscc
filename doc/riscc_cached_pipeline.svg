<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
  <title id="title">RISC-C Cached pipeline</title>
  <desc id="desc">Fetch, Decode, Execute and Writeback share a single register-file write port. Execute issues data requests while Writeback completes the preceding instruction. Independent loads and stores can advance every clock on local SRAM or cache hits. A dependent load consumer waits one clock. Separate instruction and data caches share a 32-bit backing port. Optional local SRAM connects directly to the CPU ports.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #172033; font-size: 16px; }
      .title { font-size: 25px; font-weight: bold; }
      .label { font-size: 18px; font-weight: bold; }
      .small { font-size: 14px; fill: #475569; }
      .pipe { stroke: #527694; stroke-width: 1.5; fill: #eef6ff; }
      .cache { stroke: #52856c; stroke-width: 1.5; fill: #eefaf3; }
      .memory { stroke: #9a7542; stroke-width: 1.5; fill: #fff8eb; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .control { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="570" fill="#fff"/>
  <text x="35" y="40" class="title">RISC-C Cached · RC16 / RC32 Full</text>
  <text x="35" y="68" class="small">One instruction per clock on independent ALU operations, loads and stores</text>

  <rect x="35" y="112" width="210" height="105" rx="8" class="pipe"/>
  <text x="55" y="143" class="label">1 · Fetch</text>
  <text x="55" y="173">Instruction lookup</text>
  <text x="55" y="198" class="small">Retain response on stalls</text>
  <path d="M245 164H300" class="flow"/>

  <rect x="300" y="112" width="210" height="105" rx="8" class="pipe"/>
  <text x="320" y="143" class="label">2 · Decode / RF</text>
  <text x="320" y="173">Read operands</text>
  <text x="320" y="198" class="small">Check load dependencies</text>
  <path d="M510 164H565" class="flow"/>

  <rect x="565" y="112" width="210" height="105" rx="8" class="pipe"/>
  <text x="585" y="143" class="label">3 · Execute</text>
  <text x="585" y="173">ALU · shifts · multiply</text>
  <text x="585" y="198" class="small">Issue load/store requests</text>
  <path d="M775 164H830" class="flow"/>

  <rect x="830" y="112" width="215" height="105" rx="8" class="pipe"/>
  <text x="850" y="143" class="label">4 · Writeback</text>
  <text x="850" y="173">ALU result / load data</text>
  <text x="850" y="198" class="small">Single RF write port</text>
  <path d="M670 112V88H140V112" class="control"/>
  <path d="M938 217V258H405V217" class="flow"/>
  <text x="405" y="284" class="small">Writeback and operand forwarding</text>

  <rect x="35" y="315" width="210" height="95" rx="8" class="cache"/>
  <text x="55" y="346" class="label">I-cache · 2 KiB</text>
  <text x="55" y="373" class="small">Read-only</text>
  <text x="55" y="396" class="small">Burst line fill on a miss</text>
  <path d="M140 315V217" class="flow"/>

  <rect x="565" y="315" width="210" height="95" rx="8" class="cache"/>
  <text x="585" y="346" class="label">D-cache · 2 KiB</text>
  <text x="585" y="373" class="small">Write-through</text>
  <text x="585" y="396" class="small">Burst line fill on a miss</text>
  <path d="M670 217V315" class="flow"/>
  <path d="M775 353H1000V217" class="flow"/>
  <text x="815" y="342" class="small">Load response</text>

  <path d="M140 410V464H300" class="flow"/>
  <path d="M670 410V434" class="flow"/>
  <rect x="300" y="434" width="475" height="80" rx="8" class="memory"/>
  <text x="320" y="465" class="label">Shared 32-bit backing port</text>
  <text x="320" y="493" class="small">Cache fills · ordered stores · uncached MMIO</text>
  <text x="35" y="550">Optional local SRAM bypasses both caches · misses and backpressure hold younger instructions</text>
</svg>
