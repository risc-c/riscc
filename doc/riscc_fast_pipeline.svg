<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="440" viewBox="0 0 1060 440" role="img" aria-labelledby="title desc">
  <title id="title">RISC-C Fast compact pipeline</title>
  <desc id="desc">Fetch, Decode and register-file read, and Execute overlap. Decode reads the SRAM response or a single instruction holding register. Execute shares the 16-bit memory port and forwards results to dependent instructions. One Wishbone request can be outstanding.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>
      text { font-family: sans-serif; fill: #172033; font-size: 16px; }
      .title { font-size: 25px; font-weight: bold; }
      .label { font-size: 18px; font-weight: bold; }
      .small { font-size: 14px; fill: #475569; }
      .box { stroke: #527694; stroke-width: 1.5; fill: #eef6ff; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .control { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1060" height="440" fill="#fff"/>
  <text x="35" y="42" class="title">RISC-C Fast · RC16 / RC32 Full</text>
  <text x="35" y="72" class="small">16-bit shared memory port · one outstanding Wishbone B4 request</text>
  <rect x="35" y="118" width="280" height="115" rx="8" class="box"/>
  <text x="55" y="149" class="label">1 · Fetch</text>
  <text x="55" y="178">PC + synchronous SRAM</text>
  <text x="55" y="204" class="small">Execute data has priority</text>
  <path d="M315 175H385" class="flow"/>
  <rect x="385" y="118" width="300" height="115" rx="8" class="box"/>
  <text x="405" y="149" class="label">2 · Decode / RF</text>
  <text x="405" y="178">SRAM response or held instruction</text>
  <text x="405" y="204" class="small">Synchronous operand reads</text>
  <path d="M685 175H755" class="flow"/>
  <rect x="755" y="118" width="270" height="115" rx="8" class="box"/>
  <text x="775" y="149" class="label">3 · Execute</text>
  <text x="775" y="178">ALU · shifts · multiply · memory</text>
  <text x="775" y="204" class="small">Cached r0 branch conditions</text>
  <path d="M890 233V275H535V233" class="flow"/>
  <text x="705" y="264" text-anchor="middle" class="small">Writeback and forwarding</text>
  <path d="M890 118V94H175V118" class="control"/>
  <path d="M1025 193H1040V315H175V233" class="flow"/>
  <text x="530" y="344" text-anchor="middle" class="small">Data accesses share the SRAM port; Execute retains operands until completion.</text>
  <text x="35" y="382" class="small">Taken control transfers discard younger instructions and add one bubble.</text>
  <text x="35" y="414">One-clock SRAM: ALU chains 1 IPC · byte/halfword access +1 clock · RC32 native access +2 clocks</text>
</svg>
